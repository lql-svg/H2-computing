<!DOCTYPE HTML>
<html>
<head>
<title> People </title>
</head>

<style>
	table, th, td {border: 1px solid black;
		padding: 5px; }
</style>


<body>
	<h1> Screen Names </h1>
	
	<table>
		<tr> 
			<th> Full Name </th>
			<th> Screen Name </th>
			<th> Identity </th>
		</tr> 
		
		{% for i in data %}
		<tr> 
			<td> {{ i[0] }} </td>
			<td> {{ i[1] }} </td>
			<td> {{ i[2] }} </td>
		</tr> 
		{% endfor %}

	</table>

</body>
</html>
